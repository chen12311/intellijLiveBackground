# 设置页
settings.enabled=Enable live background
settings.source=Source
settings.source.video=Video file
settings.source.video.comment=mp4, webm, mov, mkv, gif and apng all work, as long as ffmpeg can decode them. Images such as jpg, png and webp work too and are decoded only once.
settings.source.folder=Folder (rotation)
settings.rotate.every=Switch every:
settings.rotate.minutes=minutes
settings.shuffle=Shuffle
settings.recursive=Include subfolders
settings.folder.comment=Videos and images in the folder play in turn, sorted by file name. The folder is rescanned on every switch, so newly added files are picked up too. Only playing time counts: the timer stops while paused or when the IDE loses focus. 0 = no automatic switching; switch manually with Next in Tools | Live Background{0}.
settings.folder.comment.shortcut=\ ({0})
settings.source.web=Web wallpaper (experimental)
settings.source.web.comment=A Wallpaper Engine wallpaper folder of type "web" (with project.json), or any HTML page. Rendered by the built-in Chromium of the IDE. Audio visualizers stay still (no system audio) and mouse effects do not react. Page errors go to idea.log
settings.display=Display
settings.scope=Show in:
settings.scope.comment=Whole window: the project tree, tool windows, toolbars and status bar play it too. Editors only: everything else stays as it is.
settings.opacity=Opacity (%):
settings.fill=Fill mode:
settings.fps=Frame rate limit:
settings.blur=Blur radius:
settings.blur.comment=0 = no blur
settings.dim=Dim (%):
settings.decode=Decode resolution:
settings.decode.comment=Limit for the longer side, in pixels. Smaller videos are not upscaled. Higher is sharper but uses more CPU and memory. On a Retina display covering the whole window, 2K or 4K is recommended; for a sharp picture also set the blur radius above to 0.
settings.decode.size={0} ({1})
settings.decode.original=Original (no downscaling)
settings.autoPause=Auto Pause
settings.pauseWhenInactive=Pause when the IDE loses focus
settings.pauseInPowerSave=Pause in power save mode
settings.experimental=Experimental
settings.protectSelection=Protect selection and highlight colors
settings.protectSelection.comment=Makes the video fainter under selections, search highlights and similar colors.
settings.ffmpeg.path=Path:
settings.ffmpeg.found=In use: {0}
settings.ffmpeg.notExecutable=The path entered is not executable: {0}
settings.ffmpeg.notFound=ffmpeg not found. On macOS run <code>brew install ffmpeg</code>, or specify it above. Leave empty to look it up automatically.
settings.ffmpeg.download=Download ffmpeg ({0})
settings.ffmpeg.download.comment=A minimal build made for this plugin: decoding only, LGPL licensed, shared by all JetBrains IDEs.
settings.hwaccel=Hardware decoding (macOS VideoToolbox)

scope.window=Whole window
scope.editor=Editors only
fill.cover=Cover (crop what does not fit)
fill.contain=Contain (may leave borders)
fill.stretch=Stretch

