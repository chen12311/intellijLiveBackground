error.ffmpegDownload=没找到 ffmpeg，视频和图片背景要用它解码。可以下载插件专用的精简版（{0}），也可以自己安装（mac 上运行 brew install ffmpeg）。
error.ffmpegDownloadFailed=下载 ffmpeg 失败：{0}
error.playback=播放失败：{0}
error.folderNotChosen=还没选背景文件夹
error.folderMissing=文件夹不存在：{0}
