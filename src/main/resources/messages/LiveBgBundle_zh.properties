# 设置页
settings.enabled=启用动态背景
settings.source=画面来源
settings.source.video=视频文件
settings.source.video.comment=mp4、webm、mov、mkv、gif、apng 都可以，只要 ffmpeg 能解码；jpg、png、webp 这类图片也行，只解一次
settings.source.folder=文件夹（轮播）
settings.rotate.every=每隔：
settings.rotate.minutes=分钟换一个
settings.shuffle=随机顺序
settings.recursive=包含子文件夹
settings.folder.comment=文件夹里的视频和图片按文件名轮着放，换的时候会重新扫一遍，新放进去的文件也能轮到。只算播放时间，暂停、IDE 失去焦点时不计时；0 = 不自动换，用 工具 → Live Background 里的「下一个」{0}手动换
settings.folder.comment.shortcut=（{0}）
settings.source.web=网页壁纸（实验）
settings.source.web.comment=Wallpaper Engine 里类型是 web 的壁纸文件夹（有 project.json），或者任意一个 html。用 IDE 自带的 Chromium 渲染。音频可视化不会动（拿不到系统声音），跟鼠标互动的效果没反应。页面报错写在 idea.log 里
settings.display=画面
settings.scope=铺到哪里：
settings.scope.comment=整个窗口：项目树、工具窗口、工具栏、状态栏也播。只在编辑器里：其他地方保持原样
settings.opacity=不透明度（%）：
settings.fill=铺满方式：
settings.fps=帧率上限：
settings.blur=模糊半径：
settings.blur.comment=0 = 不模糊
settings.dim=压暗（%）：
settings.decode=解码分辨率：
settings.decode.comment=长边像素上限，视频本身更小时不会放大。越大越清晰，CPU、内存占用越高。Retina 屏铺满整个窗口建议 2K 或 4K；要清楚的话把上面的模糊半径设成 0
settings.decode.size={0}（{1}）
settings.decode.original=原画（不缩小）
settings.autoPause=自动暂停
settings.pauseWhenInactive=IDE 失去焦点时暂停
settings.pauseInPowerSave=省电模式下暂停
settings.experimental=实验
settings.protectSelection=保护选区和高亮颜色
settings.protectSelection.comment=原理：没设内置背景图时，临时设一张 1×1 的透明图，让平台对选区、搜索高亮等颜色降低背景透明度。会出现在「外观 → 背景图」设置里，关掉这一项会自动撤掉。
settings.ffmpeg.path=路径：
settings.ffmpeg.found=当前使用：{0}
settings.ffmpeg.notExecutable=填写的路径不可执行：{0}
settings.ffmpeg.notFound=没找到 ffmpeg。mac 上运行 <code>brew install ffmpeg</code>，或在上面手动指定。留空则自动查找。
settings.ffmpeg.download=下载 ffmpeg（{0}）
settings.ffmpeg.download.comment=插件专用的精简版：只能解码，LGPL 授权，所有 JetBrains IDE 共用一份。
settings.hwaccel=硬件解码（macOS VideoToolbox）

scope.window=整个窗口
scope.editor=只在编辑器里
fill.cover=铺满（裁掉多出的部分）
fill.contain=完整显示（可能留边）
fill.stretch=拉伸

