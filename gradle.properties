pluginGroup = io.github.livebg
pluginVersion = 0.1.1

# 编译用的最低支持版本（2025.1 = build 251，Java 21）
platformVersion = 2025.1.7

# runPhpStorm 用哪个 PhpStorm 实测：本机装了就直接用本机的，否则下载 runPhpStormVersion
localPhpStorm = /Applications/PhpStorm.app
runPhpStormVersion = 2026.2.3

# 使用 IDE 自带的 Kotlin 标准库 -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
